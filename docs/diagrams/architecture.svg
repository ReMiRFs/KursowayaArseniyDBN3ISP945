<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура аналитики продаж</title><desc id="desc">Одностраничное React-приложение обменивается JSON по HTTP с REST API на Go; бизнес-правила, проверка, RBAC, репозиторий и агрегирующие запросы PostgreSQL формируют ряды для Canvas 2D.</desc>
  <defs><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#17304d}.title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#52647a}.head{font-size:18px;font-weight:700;fill:#fff}.item{font-size:14px}.small{font-size:12px;fill:#60748a}.flow{font-size:13px;font-weight:600;fill:#355572}</style><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity=".12"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#52799a"/></marker><marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#248477"/></marker></defs>
  <rect width="1400" height="850" fill="#f5f8fc"/><text x="60" y="62" class="title">Архитектура веб-приложения</text><text x="60" y="92" class="subtitle">React и API доступны с одного origin · PostgreSQL обрабатывает SQL-запросы Go</text>
  <rect x="42" y="130" width="1316" height="670" rx="22" fill="none" stroke="#91a9bf" stroke-width="2" stroke-dasharray="9 7"/><rect x="66" y="116" width="200" height="30" rx="15" fill="#e8eff6"/><text x="82" y="136" class="small" font-weight="700">ЛОКАЛЬНАЯ СРЕДА</text>
  <g filter="url(#shadow)"><rect x="75" y="200" width="330" height="510" rx="18" fill="#fff" stroke="#d5e0ec"/><path d="M93 200 H387 Q405 200 405 218 V260 H75 V218 Q75 200 93 200" fill="#356b9a"/></g><text x="101" y="239" class="head">Браузер · React SPA</text>
  <rect x="105" y="287" width="270" height="120" rx="12" fill="#eef5fb"/><text x="125" y="317" class="item" font-weight="700">Интерфейс</text><text x="125" y="345" class="item">Фильтры и формы</text><text x="125" y="372" class="small">сбор параметров запроса</text>
  <rect x="105" y="432" width="270" height="120" rx="12" fill="#eef5fb"/><text x="125" y="462" class="item" font-weight="700">Визуализация</text><text x="125" y="490" class="item">Canvas 2D · диаграмма</text><text x="125" y="517" class="small">отрисовка рядов и показателей</text>
  <rect x="105" y="580" width="270" height="83" rx="12" fill="#f1f7f5"/><text x="125" y="610" class="item" font-weight="700">HTTP-клиент</text><text x="125" y="637" class="small">JSON-запросы к /api/v1</text>
  <g filter="url(#shadow)"><rect x="535" y="200" width="395" height="510" rx="18" fill="#fff" stroke="#d5e0ec"/><path d="M553 200 H912 Q930 200 930 218 V260 H535 V218 Q535 200 553 200" fill="#167f81"/></g><text x="561" y="239" class="head">Сервер · Go REST API</text>
  <rect x="565" y="287" width="335" height="78" rx="12" fill="#edf7f6"/><text x="585" y="318" class="item" font-weight="700">Маршруты и middleware</text><text x="585" y="344" class="small">HTTP • JSON • аутентификация</text>
  <rect x="565" y="388" width="335" height="98" rx="12" fill="#edf7f6"/><text x="585" y="419" class="item" font-weight="700">Прикладные правила</text><text x="585" y="446" class="small">валидация входных данных</text><text x="585" y="468" class="small">проверка ролей (RBAC)</text>
  <rect x="565" y="509" width="335" height="78" rx="12" fill="#edf7f6"/><text x="585" y="540" class="item" font-weight="700">Репозиторий</text><text x="585" y="566" class="small">параметризованные SQL-запросы</text>
  <rect x="565" y="610" width="335" height="63" rx="12" fill="#fff5ed"/><text x="585" y="638" class="item" font-weight="700">Ответ API</text><text x="585" y="660" class="small">агрегированные ряды в JSON</text>
  <g filter="url(#shadow)"><rect x="1060" y="200" width="265" height="510" rx="18" fill="#fff" stroke="#d5e0ec"/><path d="M1078 200 H1307 Q1325 200 1325 218 V260 H1060 V218 Q1060 200 1078 200" fill="#a85b38"/></g><text x="1086" y="239" class="head">PostgreSQL</text>
  <text x="1087" y="301" class="small" font-weight="700">ТАБЛИЦЫ</text><rect x="1085" y="315" width="215" height="43" rx="9" fill="#fbf1ec"/><text x="1104" y="342" class="item">orders</text><rect x="1085" y="368" width="215" height="43" rx="9" fill="#fbf1ec"/><text x="1104" y="395" class="item">sales_channels</text><rect x="1085" y="421" width="215" height="43" rx="9" fill="#fbf1ec"/><text x="1104" y="448" class="item">users · sessions</text>
  <line x1="1085" y1="487" x2="1300" y2="487" stroke="#e7e1dc"/><text x="1087" y="520" class="item" font-weight="700">Агрегирующие</text><text x="1087" y="542" class="item" font-weight="700">запросы</text><text x="1087" y="575" class="small">группировка и расчёты</text><text x="1087" y="598" class="small">по фильтрам отчёта</text><rect x="1085" y="630" width="215" height="45" rx="9" fill="#f1f7f5"/><text x="1100" y="658" class="small">результат: ряды данных</text>
  <path d="M405 340 H555" fill="none" stroke="#52799a" stroke-width="3" marker-end="url(#arr)"/><text x="425" y="326" class="flow">HTTP /api/v1</text>
  <path d="M555 565 H520 V600 H405" fill="none" stroke="#248477" stroke-width="3" marker-end="url(#arrGreen)"/><text x="421" y="623" class="flow">JSON · агрегаты</text>
  <path d="M930 547 H1050" fill="none" stroke="#52799a" stroke-width="3" marker-end="url(#arr)"/><text x="940" y="530" class="flow">SQL + параметры</text>
  <path d="M1050 640 H1018 V650 H940" fill="none" stroke="#248477" stroke-width="3" marker-end="url(#arrGreen)"/><text x="946" y="680" class="flow">ряды</text>
  <text x="76" y="760" class="small">Путь данных: фильтры → API → проверка доступа и правил → SQL-агрегация → JSON → Canvas 2D</text>
</svg>
